<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Payment not completed · TriSakay</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      :root { --bg: #F6F7F9; --panel: #FFFFFF; --ink: #14191D; --soft: #5A646B; --navy: #002E60; --mark: #5A646B; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0F1418; --panel: #182027; --ink: #F1F4F6; --soft: #A9B3BA; --navy: #9DB8DD; --mark: #A9B3BA; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      main { width: 100%; max-width: 420px; background: var(--panel); border-radius: 20px; padding: 32px 24px; text-align: center; box-shadow: 0 8px 30px rgba(0, 46, 96, 0.12); }
      .mark { width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 50%; background: var(--mark); display: flex; align-items: center; justify-content: center; }
      .mark svg { width: 34px; height: 34px; }
      h1 { margin: 0 0 8px; font-size: 22px; line-height: 1.25; color: var(--navy); }
      p { margin: 0 0 8px; font-size: 15px; line-height: 1.5; color: var(--soft); }
      .brand { margin-top: 24px; font-size: 13px; letter-spacing: 0.04em; color: var(--soft); }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18" /></svg>
      </div>
      <h1>Payment not completed</h1>
      <p>No payment was made.</p>
      <p>Close this window and go back to the TriSakay app. You can try again from the payment screen, or ask your driver to switch the ride to cash.</p>
      <div class="brand">TriSakay</div>
    </main>
  </body>
</html>
